version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/query
    gen:
      go:
        package: db
        out: internal/platform/database/db
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              package: uuid
              type: UUID
