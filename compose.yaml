name: vigil-dev

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: vigil
      POSTGRES_USER: vigil
      POSTGRES_PASSWORD: vigil
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - vigil_postgres_data:/var/lib/postgresql/data

volumes:
  vigil_postgres_data:
