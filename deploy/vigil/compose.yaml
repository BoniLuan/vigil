name: vigil

x-vigil-common: &vigil-common
  image: ${VIGIL_IMAGE:?set VIGIL_IMAGE to an immutable tag such as ghcr.io/boniluan/vigil:v0.1.0}
  build:
    context: ../..
    args:
      VERSION: ${VIGIL_VERSION:-dev}
      COMMIT: ${VIGIL_COMMIT:-none}
      BUILD_DATE: ${VIGIL_BUILD_DATE:-unknown}
  environment: &vigil-environment
    VIGIL_ENV: production
    VIGIL_LOG_LEVEL: ${VIGIL_LOG_LEVEL:-info}
    VIGIL_LOG_FORMAT: json
    VIGIL_DATABASE_URL: ${VIGIL_DATABASE_URL:?set VIGIL_DATABASE_URL}
    VIGIL_DATABASE_MAX_CONNS: ${VIGIL_DATABASE_MAX_CONNS:-10}
    VIGIL_DATABASE_MIN_CONNS: ${VIGIL_DATABASE_MIN_CONNS:-1}
    VIGIL_DATABASE_CONNECT_TIMEOUT: ${VIGIL_DATABASE_CONNECT_TIMEOUT:-5s}
    VIGIL_SHUTDOWN_TIMEOUT: ${VIGIL_SHUTDOWN_TIMEOUT:-35s}
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 40s

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vigil}
      POSTGRES_USER: ${POSTGRES_USER:-vigil}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - vigil_postgres_data:/var/lib/postgresql/data
    networks: [app]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    shm_size: 128mb

  vigil-api:
    <<: *vigil-common
    command: [api]
    environment:
      <<: *vigil-environment
      VIGIL_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${VIGIL_API_PORT:-8080}:8080"
    networks:
      app: {}
      monitoring:
        aliases: [vigil-api]
      edge:
        aliases: [vigil-api]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8080/readyz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  vigil-worker:
    <<: *vigil-common
    command: [worker]
    environment:
      <<: *vigil-environment
      VIGIL_WORKER_HTTP_ADDR: :9090
      VIGIL_WORKER_CONCURRENCY: ${VIGIL_WORKER_CONCURRENCY:-5}
      VIGIL_WORKER_POLL_INTERVAL: ${VIGIL_WORKER_POLL_INTERVAL:-1s}
      VIGIL_WORKER_LEASE_DURATION: ${VIGIL_WORKER_LEASE_DURATION:-45s}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      app: {}
      monitoring:
        aliases: [vigil-worker]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9090/readyz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  vigil-migrate:
    <<: *vigil-common
    command: [migrate, up]
    profiles: [tools]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app]

volumes:
  vigil_postgres_data:
    name: vigil-postgres-data

networks:
  app:
    internal: true
  monitoring:
    external: true
    name: vigil-monitoring
  edge:
    external: true
    name: web-proxy
