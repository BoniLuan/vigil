global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production
    stack: vigil

scrape_configs:
  - job_name: vigil-api
    metrics_path: /metrics
    static_configs:
      - targets: [vigil-api:8080]

  - job_name: vigil-worker
    metrics_path: /metrics
    static_configs:
      - targets: [vigil-worker:9090]

  - job_name: node-exporter
    static_configs:
      - targets: [node-exporter:9100]

  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
