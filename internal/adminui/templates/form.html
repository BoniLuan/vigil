{{define "form.html"}}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{.Title}} · Vigil</title><link rel="stylesheet" href="/assets/app.css"></head><body><header><a class="brand" href="/monitors">Vigil</a><nav><a href="{{if .IsEdit}}/monitors/{{.Monitor.ID}}{{else}}/monitors{{end}}">Cancel</a></nav></header><main class="narrow"><p class="eyebrow">Monitor configuration</p><h1>{{.Title}}</h1>{{with index .Errors "form"}}<div class="notice error">{{.}}</div>{{end}}<form class="monitor-form" method="post" action="{{.Action}}"><label>Name<input name="name" value="{{.Form.Name}}" required maxlength="200">{{with index .Errors "name"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Slug<input name="slug" value="{{.Form.Slug}}" maxlength="100" placeholder="generated-from-name">{{with index .Errors "slug"}}<small class="field-error">{{.}}</small>{{end}}</label><label class="full">Description<textarea name="description" rows="3" maxlength="2000">{{.Form.Description}}</textarea>{{with index .Errors "description"}}<small class="field-error">{{.}}</small>{{end}}</label><label class="full">URL<input type="url" name="url" value="{{.Form.URL}}" required>{{with index .Errors "url"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Method<select name="method"><option value="GET" {{if eq .Form.Method "GET"}}selected{{end}}>GET</option><option value="HEAD" {{if eq .Form.Method "HEAD"}}selected{{end}}>HEAD</option></select>{{with index .Errors "http_method"}}<small class="field-error">{{.}}</small>{{end}}</label><span></span><label>Expected status minimum<input type="number" name="status_min" value="{{.Form.StatusMin}}" min="100" max="599" required>{{with index .Errors "expected_status_min"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Expected status maximum<input type="number" name="status_max" value="{{.Form.StatusMax}}" min="100" max="599" required>{{with index .Errors "expected_status_max"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Interval (seconds)<input type="number" name="interval_seconds" value="{{.Form.IntervalSeconds}}" min="10" max="86400" required>{{with index .Errors "interval_seconds"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Timeout (milliseconds)<input type="number" name="timeout_ms" value="{{.Form.TimeoutMS}}" min="100" max="30000" required>{{with index .Errors "timeout_ms"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Failure threshold<input type="number" name="failure_threshold" value="{{.Form.FailureThreshold}}" min="1" max="100" required>{{with index .Errors "failure_threshold"}}<small class="field-error">{{.}}</small>{{end}}</label><label>Recovery threshold<input type="number" name="recovery_threshold" value="{{.Form.RecoveryThreshold}}" min="1" max="100" required>{{with index .Errors "recovery_threshold"}}<small class="field-error">{{.}}</small>{{end}}</label><label class="checkbox full"><input type="checkbox" name="public" {{if .Form.Public}}checked{{end}}> Publicly visible in a future status page</label><div class="full"><button class="primary" type="submit">{{if .IsEdit}}Save changes{{else}}Create monitor{{end}}</button></div></form></main></body></html>{{end}}
